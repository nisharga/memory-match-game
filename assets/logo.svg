<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6CF7" />
      <stop offset="100%" stop-color="#6C8CFF" />
    </linearGradient>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6CF7" />
      <stop offset="100%" stop-color="#8B8FFF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A1F36" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Back card (face down) -->
  <g transform="rotate(-12 196 266)" filter="url(#shadow)">
    <rect x="101" y="136" width="190" height="260" rx="30" fill="#FFFFFF" />
    <rect x="117" y="152" width="158" height="228" rx="20" fill="url(#cardBack)" />
    <path d="M172 230 L202 266 L172 302 L142 266 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="146" cy="182" r="7" fill="#FFFFFF" opacity="0.55" />
    <circle cx="246" cy="182" r="7" fill="#FFFFFF" opacity="0.55" />
    <circle cx="146" cy="350" r="7" fill="#FFFFFF" opacity="0.55" />
    <circle cx="246" cy="350" r="7" fill="#FFFFFF" opacity="0.55" />
  </g>

  <!-- Front card (face up) -->
  <g transform="rotate(10 318 254)" filter="url(#shadow)">
    <rect x="223" y="124" width="190" height="260" rx="30" fill="#FFFFFF" />
    <rect x="239" y="140" width="158" height="228" rx="20" fill="#EEF2FF" />
    <path d="M318.0 192.0 L334.5 235.3 L380.8 237.6 L344.6 266.7 L356.8 311.4 L318.0 286.0 L279.2 311.4 L291.4 266.7 L255.2 237.6 L301.5 235.3 Z" fill="#F59E0B" stroke="#F59E0B" stroke-width="10" stroke-linejoin="round" />
  </g>

  <!-- Match sparkles -->
  <path d="M424 78 Q424 104 450 104 Q424 104 424 130 Q424 104 398 104 Q424 104 424 78 Z" fill="#FFFFFF" />
  <path d="M456 147 Q456 160 469 160 Q456 160 456 173 Q456 160 443 160 Q456 160 456 147 Z" fill="#FFFFFF" opacity="0.8" />
</svg>
